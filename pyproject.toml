[project]
name = "calendar-backend"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
log_cli = true                    # show logs in terminal during test run
log_cli_level = "INFO"            # minimum level to show
log_file = "logs/test.log"  # write to file
log_file_level = "DEBUG"          # more verbose in the file
log_format = "%(asctime)s [%(name)s] %(levelname)s: %(message)s"